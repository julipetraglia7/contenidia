<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planificador de contenidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --font-display: 'Syne', 'Segoe UI', sans-serif;
    --font-mono: 'JetBrains Mono', 'Consolas', 'SF Mono', monospace;
    --font-body: 'Inter', 'Segoe UI', -apple-system, Roboto, sans-serif;

    /* Base */
    --bg: #0d0d0f;
    --bg-2: #131316;
    --card: #1a1a1f;
    --card-hover: #22222a;
    --border: #2e2e38;
    --border-soft: #22222a;
    --ink: #f5f4ef;
    --ink-dim: #8a8a95;

    /* Vibrant palette */
    --lime:    #C6FF59;
    --orange:  #FF5128;
    --magenta: #DB3686;
    --punch:   #C4234E;
    --deep:    #1E6C78;
    --teal:    #6C95AE;

    /* Semantic */
    --accent:      var(--orange);
    --accent-soft: var(--magenta);
    --success:     var(--lime);
    --warn:        #f9d000;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; background: var(--bg); overflow: hidden; }

  body {
    font-family: var(--font-body);
    color: var(--ink);
    display: grid;
    grid-template-columns: 280px 1fr;
    grid-template-rows: 1fr;
    font-size: 14px;
    background:
      radial-gradient(1200px 600px at 100% -10%, color-mix(in srgb, var(--magenta) 12%, transparent), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, color-mix(in srgb, var(--deep) 18%, transparent), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-soft); border-radius: 6px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border); }

  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, textarea, select { font-family: inherit; color: inherit; background: none; border: none; outline: none; }

  /* ---------- SIDEBAR ---------- */
  .sidebar {
    background: var(--bg-2);
    border-right: 1px solid var(--border-soft);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .brand {
    padding: 22px 22px 18px;
    border-bottom: 1px solid var(--border-soft);
    position: relative;
  }
  .brand::after {
    content: '';
    position: absolute;
    left: 22px; right: 22px; bottom: -1px;
    height: 1px;
    background: linear-gradient(90deg, var(--orange), var(--magenta), transparent);
    opacity: 0.5;
  }
  .brand-title {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.02em;
    background: linear-gradient(120deg, var(--lime) 0%, var(--orange) 45%, var(--magenta) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .brand-sub {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-top: 4px;
  }

  .sidebar-section {
    padding: 18px 14px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .sidebar-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent-soft);
    padding-left: 8px;
  }
  .icon-btn {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    color: var(--ink-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .15s;
    font-size: 16px;
  }
  .icon-btn:hover { background: var(--card); color: var(--ink); }

  .client-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 8px 20px;
  }
  .client-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    color: var(--ink);
    transition: background .12s;
    margin-bottom: 2px;
    position: relative;
  }
  .client-item:hover { background: var(--card); }
  .client-item.active { background: var(--card); border: 1px solid var(--border); padding: 9px 11px; }
  .client-dot {
    width: 10px;
    height: 10px;
    border-radius: 3px;
    flex-shrink: 0;
    background: var(--accent);
  }
  .client-name {
    flex: 1;
    font-size: 13.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .client-count {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-dim);
    opacity: 0.7;
  }
  .client-actions {
    display: none;
    gap: 2px;
  }
  .client-item:hover .client-actions { display: flex; }
  .client-item:hover .client-count { display: none; }

  .sidebar-footer {
    border-top: 1px solid var(--border-soft);
    padding: 12px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .storage-status {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-dim);
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    flex: 1;
  }
  .storage-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--warn);
    flex-shrink: 0;
  }
  .storage-dot.cloud { background: var(--success); }
  .user-avatar {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--card);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 10px;
    color: var(--ink);
    flex-shrink: 0;
    object-fit: cover;
    overflow: hidden;
  }
  .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .user-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .user-name {
    font-family: var(--font-body);
    font-size: 11.5px;
    font-weight: 600;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 140px;
  }
  .user-email {
    font-family: var(--font-mono);
    font-size: 9.5px;
    color: var(--ink-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 140px;
  }

  /* ---------- LOGIN SCREEN ---------- */
  .login-screen {
    position: fixed;
    inset: 0;
    z-index: 500;
    background:
      radial-gradient(1200px 700px at 100% 0%, color-mix(in srgb, var(--magenta) 25%, transparent), transparent 60%),
      radial-gradient(900px 600px at 0% 100%, color-mix(in srgb, var(--deep) 30%, transparent), transparent 60%),
      radial-gradient(700px 500px at 50% 50%, color-mix(in srgb, var(--orange) 12%, transparent), transparent 70%),
      var(--bg);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .login-screen.open { display: flex; }
  .login-card {
    max-width: 440px;
    width: 100%;
    text-align: center;
    padding: 48px 36px;
  }
  .login-badge {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--lime);
    padding: 6px 14px;
    border: 1px solid color-mix(in srgb, var(--lime) 40%, transparent);
    border-radius: 999px;
    margin-bottom: 28px;
  }
  .login-title {
    font-family: var(--font-display);
    font-size: 56px;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1;
    margin-bottom: 20px;
    background: linear-gradient(120deg, var(--lime) 0%, var(--orange) 45%, var(--magenta) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .login-sub {
    font-family: var(--font-body);
    font-size: 15px;
    color: var(--ink-dim);
    line-height: 1.6;
    margin-bottom: 40px;
  }
  .google-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: #fff;
    color: #1a1a1a;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 14.5px;
    padding: 14px 28px;
    border-radius: 999px;
    cursor: pointer;
    border: none;
    transition: all .18s;
    box-shadow: 0 8px 32px -8px color-mix(in srgb, var(--magenta) 60%, transparent);
  }
  .google-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 40px -8px color-mix(in srgb, var(--magenta) 80%, transparent);
  }
  .google-btn svg { flex-shrink: 0; }
  .login-note {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-dim);
    margin-top: 32px;
    line-height: 1.6;
  }

  /* ---------- MAIN ---------- */
  main {
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background: var(--bg);
  }

  .topbar {
    padding: 20px 32px;
    border-bottom: 1px solid var(--border-soft);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    min-height: 78px;
  }

  .breadcrumbs {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-bottom: 6px;
  }
  .breadcrumbs a { color: var(--accent-soft); cursor: pointer; text-decoration: none; }
  .breadcrumbs a:hover { color: var(--ink); }
  .breadcrumbs .sep { opacity: 0.4; }

  .page-title {
    font-family: var(--font-display);
    font-size: 30px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.025em;
    line-height: 1.1;
  }

  .topbar-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .btn {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 9px 16px;
    cursor: pointer;
    transition: all .15s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }
  .btn:hover { background: color-mix(in srgb, var(--magenta) 15%, transparent); color: var(--ink); border-color: var(--magenta); }
  .btn.primary {
    background: var(--orange);
    color: #0d0d0f;
    border-color: var(--orange);
    font-weight: 600;
    box-shadow: 0 0 0 0 color-mix(in srgb, var(--orange) 40%, transparent);
    transition: all .18s;
  }
  .btn.primary:hover {
    background: var(--magenta);
    border-color: var(--magenta);
    color: #fff;
    box-shadow: 0 6px 24px -6px color-mix(in srgb, var(--magenta) 60%, transparent);
    transform: translateY(-1px);
  }
  .btn.ghost { border-color: var(--border-soft); color: var(--ink-dim); }
  .btn.ghost:hover { color: var(--ink); }
  .btn.danger:hover { background: var(--punch); border-color: var(--punch); color: #fff; }

  .content {
    flex: 1;
    overflow-y: auto;
    padding: 28px 32px 60px;
  }

  /* ---------- EMPTY STATES ---------- */
  .empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--ink-dim);
  }
  .empty-icon {
    font-size: 48px;
    margin-bottom: 16px;
    opacity: 0.4;
    font-family: var(--font-display);
  }
  .empty h3 {
    font-family: var(--font-display);
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin-bottom: 10px;
  }
  .empty p { font-size: 14px; max-width: 380px; margin: 0 auto 20px; line-height: 1.6; }

  /* ---------- CARDS GRID (clients / plans) ---------- */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border-soft);
    border-radius: 14px;
    padding: 20px;
    cursor: pointer;
    transition: all .15s;
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: relative;
    min-height: 140px;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); background: var(--card-hover); }
  .card-tag {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent-soft);
  }
  .card-title {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--ink);
    line-height: 1.2;
  }
  .card-meta {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-dim);
    margin-top: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .card-menu {
    position: absolute;
    top: 12px;
    right: 12px;
    display: none;
  }
  .card:hover .card-menu { display: flex; }

  /* ---------- POSTS: GRID VIEW (like IG grid) ---------- */
  .view-toggle {
    display: inline-flex;
    background: var(--card);
    border: 1px solid var(--border-soft);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
  }
  .view-toggle button {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-dim);
    padding: 6px 14px;
    border-radius: 999px;
    transition: all .12s;
  }
  .view-toggle button.active { background: var(--lime); color: #0d0d0f; font-weight: 600; }

  .posts-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    max-width: 640px;
    margin: 0 auto;
    background: var(--bg-2);
    padding: 4px;
    border: 1px solid var(--border-soft);
    border-radius: 8px;
  }
  .posts-grid .grid-cell {
    aspect-ratio: 1;
    background: var(--card);
    position: relative;
    cursor: pointer;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .posts-grid .grid-cell:hover { outline: 2px solid var(--accent); z-index: 2; }
  .posts-grid .grid-cell img { width: 100%; height: 100%; object-fit: cover; }
  .posts-grid .grid-cell.empty-cell {
    color: var(--ink-dim);
    font-family: var(--font-mono);
    font-size: 10px;
    opacity: 0.3;
  }
  .posts-grid .grid-cell .type-badge {
    position: absolute;
    top: 6px;
    right: 6px;
    background: rgba(0,0,0,0.6);
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: 9px;
    padding: 3px 6px;
    border-radius: 4px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .posts-grid .grid-cell .date-badge {
    position: absolute;
    bottom: 6px;
    left: 6px;
    background: rgba(0,0,0,0.6);
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: 10px;
    padding: 3px 6px;
    border-radius: 4px;
  }

  /* ---------- POSTS: LIST VIEW ---------- */
  .posts-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .post-row {
    display: grid;
    grid-template-columns: 100px 1fr auto;
    gap: 20px;
    background: var(--card);
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    padding: 14px;
    cursor: pointer;
    transition: all .15s;
    align-items: center;
  }
  .post-row:hover { border-color: var(--accent); background: var(--card-hover); }
  .post-thumb {
    aspect-ratio: 1;
    background: var(--bg-2);
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-dim);
    font-family: var(--font-mono);
    font-size: 10px;
    position: relative;
  }
  .post-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .post-thumb.vertical { aspect-ratio: 9/16; width: 56px; margin: 0 auto; }
  .post-info { min-width: 0; }
  .post-meta {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--accent-soft);
    margin-bottom: 4px;
    display: flex;
    gap: 10px;
  }
  .post-meta .dot { opacity: 0.4; }
  .post-copy {
    color: var(--ink);
    font-size: 13.5px;
    line-height: 1.5;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .post-hashtags {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--accent-soft);
    opacity: 0.75;
    margin-top: 6px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .post-row-actions {
    display: flex;
    gap: 6px;
    opacity: 0;
    transition: opacity .12s;
  }
  .post-row:hover .post-row-actions { opacity: 1; }

  /* ---------- CALENDAR VIEW ---------- */
  .calendar-wrap {
    background: var(--card);
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    padding: 20px;
  }
  .calendar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .calendar-title {
    font-family: var(--font-display);
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.02em;
    text-transform: capitalize;
  }
  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .cal-dow {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent-soft);
    padding: 8px;
    text-align: center;
  }
  .cal-day {
    aspect-ratio: 1;
    background: var(--bg-2);
    border: 1px solid var(--border-soft);
    border-radius: 8px;
    padding: 6px;
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow: hidden;
    cursor: pointer;
  }
  .cal-day:hover { border-color: var(--border); }
  .cal-day.other-month { opacity: 0.3; }
  .cal-day-num {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-dim);
  }
  .cal-day.today .cal-day-num {
    color: var(--accent);
    font-weight: 700;
  }
  .cal-post-mini {
    background: var(--accent);
    color: var(--ink);
    font-size: 9px;
    padding: 2px 4px;
    border-radius: 3px;
    font-family: var(--font-mono);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    cursor: pointer;
  }

  /* ---------- MODAL ---------- */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
    backdrop-filter: blur(4px);
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 16px;
    max-width: 900px;
    width: 100%;
    max-height: 90vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .modal-header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border-soft);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .modal-title {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .modal-body {
    padding: 24px;
    overflow-y: auto;
    flex: 1;
  }
  .modal-footer {
    padding: 16px 24px;
    border-top: 1px solid var(--border-soft);
    display: flex;
    justify-content: space-between;
    gap: 10px;
  }

  /* ---------- FORM ---------- */
  .field { margin-bottom: 18px; }
  .field label {
    display: block;
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent-soft);
    margin-bottom: 6px;
  }
  .input, .textarea, .select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border-soft);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--ink);
    font-size: 13.5px;
    transition: border-color .12s;
  }
  .input:focus, .textarea:focus, .select:focus { border-color: var(--accent-soft); }
  .textarea { resize: vertical; min-height: 100px; font-family: var(--font-body); line-height: 1.5; }
  .select { appearance: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%23d28379'/></svg>"); background-repeat: no-repeat; background-position: right 14px center; padding-right: 34px; }

  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  /* Post editor: split layout */
  .editor-split {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 24px;
  }
  .editor-media {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .media-drop {
    aspect-ratio: 1;
    background: var(--bg);
    border: 1.5px dashed var(--border);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--ink-dim);
    cursor: pointer;
    text-align: center;
    padding: 20px;
    transition: all .15s;
    position: relative;
    overflow: hidden;
  }
  .media-drop:hover { border-color: var(--accent-soft); background: var(--card); }
  .media-drop.vertical { aspect-ratio: 9/16; }
  .media-drop img { width: 100%; height: 100%; object-fit: cover; }
  .media-drop-hint {
    font-family: var(--font-mono);
    font-size: 11px;
    line-height: 1.5;
  }
  .media-drop-hint strong { color: var(--accent-soft); }
  .media-actions {
    display: flex;
    gap: 6px;
    justify-content: center;
  }
  .media-actions button {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-dim);
    padding: 6px 10px;
    border-radius: 6px;
    transition: all .12s;
  }
  .media-actions button:hover { background: var(--card); color: var(--ink); }

  /* Carousel slides */
  .carousel-slides {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 4px 0;
  }
  .carousel-slide {
    flex: 0 0 60px;
    aspect-ratio: 1;
    background: var(--bg);
    border: 1px solid var(--border-soft);
    border-radius: 6px;
    position: relative;
    overflow: hidden;
    cursor: pointer;
  }
  .carousel-slide.active { border-color: var(--accent); }
  .carousel-slide img { width: 100%; height: 100%; object-fit: cover; }
  .carousel-slide .del {
    position: absolute;
    top: 2px;
    right: 2px;
    background: rgba(0,0,0,0.7);
    color: var(--ink);
    width: 16px;
    height: 16px;
    border-radius: 50%;
    font-size: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .carousel-add {
    flex: 0 0 60px;
    aspect-ratio: 1;
    border: 1.5px dashed var(--border-soft);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-dim);
    font-size: 20px;
    cursor: pointer;
  }
  .carousel-add:hover { border-color: var(--accent-soft); color: var(--accent-soft); }

  /* Video badges / play overlays */
  .video-badge {
    position: absolute;
    top: 10px;
    left: 10px;
    background: color-mix(in srgb, var(--magenta) 90%, black);
    color: #fff;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    padding: 4px 9px;
    border-radius: 4px;
    pointer-events: none;
    z-index: 2;
  }
  .slide-play {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #fff;
    font-size: 14px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    pointer-events: none;
  }
  .play-overlay {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: color-mix(in srgb, var(--magenta) 90%, black);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    padding-left: 3px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    pointer-events: none;
  }
  .play-overlay.small { width: 28px; height: 28px; font-size: 11px; }
  .media-drop { position: relative; }

  /* ---------- TYPE PICKER ---------- */
  .type-picker {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 18px;
  }
  .type-option {
    background: var(--bg);
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    padding: 14px 10px;
    text-align: center;
    cursor: pointer;
    transition: all .12s;
  }
  .type-option:hover { border-color: var(--border); }
  .type-option.selected { border-color: var(--magenta); background: color-mix(in srgb, var(--magenta) 15%, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--magenta) 10%, transparent); }
  .type-option.selected .type-option-name { color: var(--magenta); font-weight: 600; }
  .type-option.selected .type-option-icon { color: var(--magenta); }
  .type-option-icon { font-size: 20px; margin-bottom: 4px; font-family: var(--font-display); }
  .type-option-name {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink);
  }

  /* ---------- TOAST ---------- */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 18px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink);
    z-index: 200;
    opacity: 0;
    transform: translateY(10px);
    transition: all .2s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  /* ---------- CONFIRM DIALOG ---------- */
  .confirm-msg { color: var(--ink); line-height: 1.5; margin-bottom: 8px; }
  .confirm-sub { color: var(--ink-dim); font-size: 12.5px; }

  /* ---------- HASHTAG CHIPS ---------- */
  .hashtag-input-wrap {
    background: var(--bg);
    border: 1px solid var(--border-soft);
    border-radius: 8px;
    padding: 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    min-height: 42px;
  }
  .hashtag-input-wrap:focus-within { border-color: var(--accent-soft); }
  .hashtag-chip {
    background: color-mix(in srgb, var(--accent) 18%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
    color: var(--accent-soft);
    font-family: var(--font-mono);
    font-size: 11.5px;
    padding: 3px 8px 3px 10px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .hashtag-chip button {
    color: var(--accent-soft);
    opacity: 0.6;
    font-size: 14px;
    line-height: 1;
    padding: 0 2px;
  }
  .hashtag-chip button:hover { opacity: 1; }
  .hashtag-input {
    flex: 1;
    min-width: 100px;
    background: none;
    border: none;
    outline: none;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink);
    padding: 4px 6px;
  }

  /* ---------- COLOR PICKER ---------- */
  .color-swatches {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .color-swatch {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform .12s;
  }
  .color-swatch:hover { transform: scale(1.1); }
  .color-swatch.selected { border-color: var(--ink); }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 900px) {
    body { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .editor-split { grid-template-columns: 1fr; }
  }
</style>
</head>

    <button class="google-btn" onclick="Store.signInWithGoogle()">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>

<!-- ============ APP ============ -->
<script>
/* ================================================================
   PLANIFICADOR — Content Studio
   Almacenamiento: LocalStorage (por defecto) + Firebase (opcional)
   Para activar Firebase: completar FB_CONFIG abajo y descomentar.
   ================================================================ */

/* ================================================================
   FIREBASE CONFIG — PEGÁ ACÁ TUS CLAVES PARA ACTIVAR LA NUBE
   ================================================================
   Con el objeto vacío la app usa LocalStorage (funciona igual).
   Para activar login con Google + sincronización:
   1) console.firebase.google.com → Crear proyecto
   2) Activar Authentication → Sign-in method → Google
   3) Activar Firestore Database (en modo producción)
   4) Ir a Configuración del proyecto (⚙) → Tus apps → Web (</>)
   5) Copiar el objeto firebaseConfig y pegarlo abajo reemplazando este bloque
   ================================================================ */
const FB_CONFIG = {
  // apiKey: "AIza...",
  // authDomain: "TU-PROYECTO.firebaseapp.com",
  // projectId: "TU-PROYECTO",
  // storageBucket: "TU-PROYECTO.appspot.com",
  // messagingSenderId: "...",
  // appId: "1:...:web:..."
};

/* ---- STATE ---- */
const state = {
  clients: [],        // {id, name, color, createdAt}
  plans: [],          // {id, clientId, name, month, year, createdAt}
  posts: [],          // {id, planId, type, date, time, images[], copy, hashtags[], cta, notes, order}
  view: 'home',       // 'home' | 'client' | 'plan'
  currentClient: null,
  currentPlan: null,
  postView: 'grid',   // 'grid' | 'list' | 'calendar'
};

const PALETTE = ['#FF5128','#DB3686','#C6FF59','#C4234E','#1E6C78','#6C95AE','#F9D000','#7C4DFF'];

const POST_TYPES = {
  post:     { label: 'Post',     icon: '▢', vertical: false, multi: false },
  carousel: { label: 'Carrusel', icon: '▤', vertical: false, multi: true },
  story:    { label: 'Story',    icon: '▯', vertical: true,  multi: false },
  reel:     { label: 'Reel',     icon: '▶', vertical: true,  multi: false },
  tiktok:   { label: 'TikTok',   icon: '♪', vertical: true,  multi: false },
  fb:       { label: 'Facebook', icon: 'f', vertical: false, multi: false },
};

const MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DOWS = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];

/* ---- STORAGE LAYER ---- */
const Store = {
  useCloud: false,
  db: null,
  uid: null,
  user: null,
  auth: null,
  _authFns: null,

  async init() {
    if (FB_CONFIG.apiKey) {
      try {
        await this._initFirebase();
        this.useCloud = true;
      } catch(e) {
        console.warn('Firebase falló, usando LocalStorage:', e);
        this.useCloud = false;
        toast('Firebase no arrancó — usando LocalStorage');
      }
    }
    if (this.useCloud && !this.user) {
      showLoginScreen();
      return;
    }
    updateStorageStatus();
    await this.loadAll();
  },

  async _initFirebase() {
    const [
      { initializeApp },
      { getFirestore, collection, doc, getDocs, setDoc, deleteDoc },
      { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged, setPersistence, browserLocalPersistence }
    ] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js'),
      import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js'),
    ]);
    const app = initializeApp(FB_CONFIG);
    this.auth = getAuth(app);
    this.db = getFirestore(app);
    this._fs = { collection, doc, getDocs, setDoc, deleteDoc };
    this._authFns = { GoogleAuthProvider, signInWithPopup, signOut };
    await setPersistence(this.auth, browserLocalPersistence);
    // Wait for the initial auth state (may already have a session)
    await new Promise((resolve) => {
      const unsub = onAuthStateChanged(this.auth, (u) => {
        this.user = u || null;
        this.uid = u ? u.uid : null;
        unsub();
        resolve();
      });
    });
  },

  async signInWithGoogle() {
    if (!this.auth) return;
    const { GoogleAuthProvider, signInWithPopup } = this._authFns;
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    try {
      const res = await signInWithPopup(this.auth, provider);
      this.user = res.user;
      this.uid = res.user.uid;
      hideLoginScreen();
      updateStorageStatus();
      await this.loadAll();
      state.posts.forEach(ensureMediaField);
      render();
      toast(`¡Hola ${this.user.displayName?.split(' ')[0] || ''}!`);
    } catch(e) {
      console.error(e);
      alert('No se pudo iniciar sesión:\n' + (e.message || e.code));
    }
  },

  async signOutUser() {
    if (!this.auth) return;
    if (!confirm('¿Cerrar sesión?\nTus datos quedan en la nube, los vas a ver de nuevo al iniciar sesión otra vez.')) return;
    await this._authFns.signOut(this.auth);
    this.user = null; this.uid = null;
    state.clients = []; state.plans = []; state.posts = [];
    state.currentClient = null; state.currentPlan = null; state.view = 'home';
    showLoginScreen();
  },

  async loadAll() {
    if (this.useCloud) {
      const { collection, getDocs } = this._fs;
      const base = `users/${this.uid}`;
      const [c, p, po] = await Promise.all([
        getDocs(collection(this.db, `${base}/clients`)),
        getDocs(collection(this.db, `${base}/plans`)),
        getDocs(collection(this.db, `${base}/posts`)),
      ]);
      state.clients = c.docs.map(d => d.data());
      state.plans = p.docs.map(d => d.data());
      state.posts = po.docs.map(d => d.data());
    } else {
      state.clients = JSON.parse(localStorage.getItem('plani_clients') || '[]');
      state.plans = JSON.parse(localStorage.getItem('plani_plans') || '[]');
      state.posts = JSON.parse(localStorage.getItem('plani_posts') || '[]');
    }
  },

  async saveClient(c) {
    if (this.useCloud) {
      const { doc, setDoc } = this._fs;
      await setDoc(doc(this.db, `users/${this.uid}/clients/${c.id}`), c);
    } else {
      localStorage.setItem('plani_clients', JSON.stringify(state.clients));
    }
  },
  async savePlan(p) {
    if (this.useCloud) {
      const { doc, setDoc } = this._fs;
      await setDoc(doc(this.db, `users/${this.uid}/plans/${p.id}`), p);
    } else {
      localStorage.setItem('plani_plans', JSON.stringify(state.plans));
    }
  },
  async savePost(p) {
    if (this.useCloud) {
      const { doc, setDoc } = this._fs;
      await setDoc(doc(this.db, `users/${this.uid}/posts/${p.id}`), p);
    } else {
      localStorage.setItem('plani_posts', JSON.stringify(state.posts));
    }
  },
  async deleteClient(id) {
    if (this.useCloud) {
      const { doc, deleteDoc } = this._fs;
      await deleteDoc(doc(this.db, `users/${this.uid}/clients/${id}`));
    } else localStorage.setItem('plani_clients', JSON.stringify(state.clients));
  },
  async deletePlan(id) {
    if (this.useCloud) {
      const { doc, deleteDoc } = this._fs;
      await deleteDoc(doc(this.db, `users/${this.uid}/plans/${id}`));
    } else localStorage.setItem('plani_plans', JSON.stringify(state.plans));
  },
  async deletePost(id) {
    if (this.useCloud) {
      const { doc, deleteDoc } = this._fs;
      await deleteDoc(doc(this.db, `users/${this.uid}/posts/${id}`));
    } else localStorage.setItem('plani_posts', JSON.stringify(state.posts));
  },

  async exportBackup() {
    // Collect all videoIds referenced by posts, pull blobs from IDB, encode as base64
    const videoIds = new Set();
    for (const p of state.posts) {
      ensureMediaField(p);
      for (const m of p.media) if (m.type === 'video') videoIds.add(m.videoId);
    }
    const videos = {};
    let totalSize = 0;
    for (const id of videoIds) {
      const blob = await VideoDB.get(id);
      if (blob) {
        totalSize += blob.size;
        videos[id] = { mimeType: blob.type || 'video/mp4', dataUrl: await blobToDataURL(blob) };
      }
    }
    if (totalSize > 300 * 1024 * 1024) {
      if (!confirm(`El backup va a pesar ~${(totalSize/1024/1024).toFixed(0)}MB por los videos. ¿Continuar?`)) return;
    }
    if (videoIds.size) toast(`Empaquetando ${videoIds.size} video(s)…`);
    const data = { version: 2, clients: state.clients, plans: state.plans, posts: state.posts, videos, exportedAt: Date.now() };
    const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `planificador-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  },

  async importBackup(file) {
    const text = await file.text();
    const data = JSON.parse(text);
    if (!data.clients) throw new Error('Archivo inválido');
    state.clients = data.clients || [];
    state.plans = data.plans || [];
    state.posts = data.posts || [];
    // Restore videos to IndexedDB
    if (data.videos) {
      for (const [id, v] of Object.entries(data.videos)) {
        const blob = await (await fetch(v.dataUrl)).blob();
        await VideoDB.put(id, blob);
      }
    }
    if (this.useCloud) {
      for (const c of state.clients) await this.saveClient(c);
      for (const p of state.plans) await this.savePlan(p);
      for (const po of state.posts) await this.savePost(po);
    } else {
      localStorage.setItem('plani_clients', JSON.stringify(state.clients));
      localStorage.setItem('plani_plans', JSON.stringify(state.plans));
      localStorage.setItem('plani_posts', JSON.stringify(state.posts));
    }
  }
};

/* ---- UI HELPERS: LOGIN + STATUS ---- */
function showLoginScreen() {
  document.getElementById('loginScreen').classList.add('open');
}
function hideLoginScreen() {
  document.getElementById('loginScreen').classList.remove('open');
}
function updateStorageStatus() {
  const el = document.getElementById('storageStatus');
  if (!el) return;
  if (Store.useCloud && Store.user) {
    const u = Store.user;
    const initial = (u.displayName || u.email || '?').trim()[0].toUpperCase();
    const avatar = u.photoURL
      ? `<div class="user-avatar"><img src="${u.photoURL}" referrerpolicy="no-referrer"></div>`
      : `<div class="user-avatar" style="background:var(--magenta);color:#fff;">${initial}</div>`;
    el.innerHTML = `
      ${avatar}
      <div class="user-info">
        <div class="user-name">${esc(u.displayName || 'Cuenta Google')}</div>
        <div class="user-email">${esc(u.email || '')}</div>
      </div>
    `;
    // Convert the settings gear button into a logout menu access point (settings modal has both)
  } else {
    el.innerHTML = '<span class="storage-dot"></span><span>Local (este navegador)</span>';
  }
}

/* ---- UTILS ---- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = (s) => (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const toast = (msg) => {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
};

function fileToDataURL(file, maxSide = 1400, quality = 0.85) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = () => {
      img.onload = () => {
        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        const w = img.width * scale, h = img.height * scale;
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---- VIDEO STORAGE (IndexedDB) ---- */
const VideoDB = {
  db: null,
  async init() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open('plani_media', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('videos');
      req.onsuccess = () => { this.db = req.result; resolve(); };
      req.onerror = () => reject(req.error);
    });
  },
  put(id, blob) {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction('videos', 'readwrite');
      tx.objectStore('videos').put(blob, id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  },
  get(id) {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction('videos', 'readonly');
      const req = tx.objectStore('videos').get(id);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  },
  delete(id) {
    return new Promise((resolve) => {
      const tx = this.db.transaction('videos', 'readwrite');
      tx.objectStore('videos').delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => resolve();
    });
  }
};

/* Object URL cache — se revocan al cerrar modal / re-render pesado */
const urlCache = new Map();
async function videoUrl(videoId) {
  if (urlCache.has(videoId)) return urlCache.get(videoId);
  const blob = await VideoDB.get(videoId);
  if (!blob) return null;
  const url = URL.createObjectURL(blob);
  urlCache.set(videoId, url);
  return url;
}
function clearUrlCache() {
  for (const url of urlCache.values()) URL.revokeObjectURL(url);
  urlCache.clear();
}

/* Extract first-frame thumbnail from a video file */
async function extractVideoThumb(file, maxSide = 800) {
  return new Promise((resolve, reject) => {
    const video = document.createElement('video');
    video.preload = 'metadata';
    video.muted = true;
    video.playsInline = true;
    const url = URL.createObjectURL(file);
    video.src = url;
    const cleanup = () => URL.revokeObjectURL(url);
    video.onloadeddata = () => {
      try { video.currentTime = Math.min(0.5, (video.duration || 1) / 4); }
      catch(e) { /* some browsers seek immediately */ }
    };
    video.onseeked = () => {
      try {
        const w0 = video.videoWidth, h0 = video.videoHeight;
        const scale = Math.min(1, maxSide / Math.max(w0, h0));
        const canvas = document.createElement('canvas');
        canvas.width = w0 * scale;
        canvas.height = h0 * scale;
        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
        const thumb = canvas.toDataURL('image/jpeg', 0.82);
        cleanup();
        resolve({ thumb, width: w0, height: h0, duration: video.duration || 0 });
      } catch(e) { cleanup(); reject(e); }
    };
    video.onerror = () => { cleanup(); reject(new Error('No se pudo procesar el video')); };
    // Fallback: some codecs never fire onseeked → force after a delay
    setTimeout(() => {
      if (!video.videoWidth) return;
      video.onseeked && video.onseeked();
    }, 3000);
  });
}

async function processMediaFile(file) {
  if (file.type.startsWith('video/')) {
    if (file.size > 250 * 1024 * 1024) {
      throw new Error('El video supera 250MB. Comprimilo antes de subirlo.');
    }
    const { thumb, duration } = await extractVideoThumb(file);
    const videoId = 'v_' + uid();
    await VideoDB.put(videoId, file);
    return { type: 'video', videoId, thumb, mimeType: file.type, name: file.name, size: file.size, duration };
  } else if (file.type.startsWith('image/')) {
    const src = await fileToDataURL(file);
    return { type: 'image', src };
  } else {
    throw new Error('Formato no soportado');
  }
}

/* Migrate old post schema (images[]) → media[] */
function ensureMediaField(post) {
  if (!post.media) {
    post.media = (post.images || []).map(src => ({ type: 'image', src }));
  }
  return post;
}

function formatDate(d) {
  if (!d) return '';
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('es-AR', { day: '2-digit', month: 'short' });
}

/* ---- ROUTER / VIEWS ---- */
function selectClient(id) {
  state.currentClient = state.clients.find(c => c.id === id);
  state.currentPlan = null;
  state.view = 'client';
  render();
}
function selectPlan(id) {
  state.currentPlan = state.plans.find(p => p.id === id);
  state.view = 'plan';
  render();
}
function goHome() {
  state.currentClient = null;
  state.currentPlan = null;
  state.view = 'home';
  render();
}
function goClient() {
  state.currentPlan = null;
  state.view = 'client';
  render();
}

function render() {
  renderSidebar();
  const bc = document.getElementById('breadcrumbs');
  const title = document.getElementById('pageTitle');
  const actions = document.getElementById('topbarActions');
  const content = document.getElementById('content');

  if (state.view === 'home') {
    bc.innerHTML = '';
    title.textContent = 'Todos los clientes';
    actions.innerHTML = `
      <button class="btn ghost" onclick="Store.exportBackup()">Backup JSON</button>
      <label class="btn ghost" style="cursor:pointer;">
        Importar
        <input type="file" accept="application/json" style="display:none" onchange="handleImport(event)">
      </label>
      <button class="btn primary" onclick="openClientEditor()">+ Nuevo cliente</button>
    `;
    renderHomeView();
  } else if (state.view === 'client') {
    bc.innerHTML = `<a onclick="goHome()">Clientes</a><span class="sep">/</span><span>${esc(state.currentClient.name)}</span>`;
    title.innerHTML = `<span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${state.currentClient.color};margin-right:10px;vertical-align:middle;"></span>${esc(state.currentClient.name)}`;
    actions.innerHTML = `<button class="btn primary" onclick="openPlanEditor()">+ Nueva planificación</button>`;
    renderClientView();
  } else if (state.view === 'plan') {
    bc.innerHTML = `<a onclick="goHome()">Clientes</a><span class="sep">/</span><a onclick="goClient()">${esc(state.currentClient.name)}</a><span class="sep">/</span><span>${esc(state.currentPlan.name)}</span>`;
    title.textContent = state.currentPlan.name;
    actions.innerHTML = `
      <div class="view-toggle">
        <button class="${state.postView==='grid'?'active':''}" onclick="setPostView('grid')">Grid</button>

}

/* ---- PLAN VIEW (posts) ---- */
function renderPlanView() {
  const content = document.getElementById('content');
  const posts = state.posts.filter(po => po.planId === state.currentPlan.id)
    .sort((a,b) => (a.date||'z').localeCompare(b.date||'z'));

  if (!posts.length) {
    content.innerHTML = `
      <div class="empty">
        <div class="empty-icon">◈</div>
        <h3>Empezá a cargar contenido</h3>
        <p>Sumá posts, carruseles, stories, reels o tiktoks. Podés adjuntar imágenes, copies y hashtags para cada uno.</p>
        <button class="btn primary" onclick="openPostEditor()">+ Cargar primer post</button>
      </div>`;
    return;
  }

  if (state.postView === 'grid') renderPostsGrid(posts);
  else if (state.postView === 'list') renderPostsList(posts);
  else renderPostsCalendar(posts);
}

function renderPostsGrid(posts) {
  const content = document.getElementById('content');
  const feedPosts = posts.filter(p => !POST_TYPES[p.type].vertical);
  const verticalPosts = posts.filter(p => POST_TYPES[p.type].vertical);

  let html = '';
  if (feedPosts.length) {
    html += `<div style="max-width:640px;margin:0 auto 8px;font-family:var(--font-mono);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--accent-soft);">Grid Feed</div>`;
    html += `<div class="posts-grid">${feedPosts.map(p => gridCell(p)).join('')}</div>`;
  }
  if (verticalPosts.length) {
    html += `<div style="max-width:640px;margin:32px auto 8px;font-family:var(--font-mono);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--accent-soft);">Stories / Reels / TikTok</div>`;
    html += `<div class="posts-grid" style="grid-template-columns:repeat(4,1fr);">${verticalPosts.map(p => gridCell(p, true)).join('')}</div>`;
  }
  content.innerHTML = html;
}

function gridCell(p, vertical=false) {
  ensureMediaField(p);
  const m = p.media && p.media[0];
  const thumbSrc = m ? (m.type === 'image' ? m.src : m.thumb) : null;
  const inner = thumbSrc
    ? `<img src="${thumbSrc}">${m.type==='video' ? '<span class="play-overlay">▶</span>' : ''}`
    : `<span class="empty-cell">Sin media</span>`;
  const style = vertical ? 'style="aspect-ratio:9/16;"' : '';
  return `
    <div class="grid-cell" ${style} onclick="openPostEditor('${p.id}')">
      ${inner}
      <div class="type-badge">${POST_TYPES[p.type].icon} ${POST_TYPES[p.type].label}</div>
      ${p.date ? `<div class="date-badge">${formatDate(p.date)}</div>` : ''}
    </div>
  `;
}

function renderPostsList(posts) {
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="posts-list">
      ${posts.map(p => {
        ensureMediaField(p);
        const t = POST_TYPES[p.type];
        const m = p.media && p.media[0];
        const thumbSrc = m ? (m.type === 'image' ? m.src : m.thumb) : null;
        const thumb = thumbSrc
          ? `<img src="${thumbSrc}">${m.type==='video' ? '<span class="play-overlay small">▶</span>' : ''}`
          : `<span>${t.icon}</span>`;
        return `
          <div class="post-row" onclick="openPostEditor('${p.id}')">
            <div class="post-thumb ${t.vertical?'vertical':''}">${thumb}</div>
            <div class="post-info">
              <div class="post-meta">
                <span>${t.label}</span>
                ${p.date ? `<span class="dot">·</span><span>${formatDate(p.date)}${p.time?' '+p.time:''}</span>`:''}
                ${p.cta ? `<span class="dot">·</span><span>CTA: ${esc(p.cta)}</span>`:''}
              </div>
              <div class="post-copy">${esc(p.copy) || '<span style="opacity:0.4;">Sin copy todavía…</span>'}</div>
              ${p.hashtags && p.hashtags.length ? `<div class="post-hashtags">${p.hashtags.map(h => '#'+esc(h)).join(' ')}</div>` : ''}
            </div>
            <div class="post-row-actions">
              <button class="icon-btn" onclick="event.stopPropagation();duplicatePost('${p.id}')" title="Duplicar">⧉</button>
              <button class="icon-btn" onclick="event.stopPropagation();confirmDeletePost('${p.id}')" title="Eliminar">×</button>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function renderPostsCalendar(posts) {
  const content = document.getElementById('content');
  const plan = state.currentPlan;
  const first = new Date(plan.year, plan.month, 1);
  const startOffset = (first.getDay() + 6) % 7; // Lun=0
  const daysInMonth = new Date(plan.year, plan.month + 1, 0).getDate();
  const today = new Date();
  const cells = [];
  for (let i = 0; i < startOffset; i++) cells.push({ empty: true });
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${plan.year}-${String(plan.month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayPosts = posts.filter(p => p.date === dateStr);
    const isToday = today.getFullYear()===plan.year && today.getMonth()===plan.month && today.getDate()===d;
    cells.push({ day: d, dateStr, dayPosts, isToday });
  }
  content.innerHTML = `
    <div class="calendar-wrap">
      <div class="calendar-header">
        <div class="calendar-title">${MONTHS[plan.month]} ${plan.year}</div>
      </div>
      <div class="calendar-grid">
        ${DOWS.map(d => `<div class="cal-dow">${d}</div>`).join('')}
        ${cells.map(c => c.empty
          ? `<div class="cal-day other-month"></div>`
          : `<div class="cal-day ${c.isToday?'today':''}" onclick="openPostEditor(null,'${c.dateStr}')">
              <div class="cal-day-num">${c.day}</div>
              ${c.dayPosts.map(p => `<div class="cal-post-mini" onclick="event.stopPropagation();openPostEditor('${p.id}')" title="${esc(p.copy||'')}">${POST_TYPES[p.type].icon} ${POST_TYPES[p.type].label}</div>`).join('')}
            </div>`
        ).join('')}
      </div>
    </div>
  `;
}

function closeModal() {

/* ---- CLIENT EDITOR ---- */
function openClientEditor(id = null) {
  const c = id ? state.clients.find(x => x.id === id) : { id: uid(), name: '', color: PALETTE[state.clients.length % PALETTE.length], createdAt: Date.now() };
  const isNew = !id;
  openModal(`
    <div class="modal-header">
      <div class="modal-title">${isNew?'Nuevo cliente':'Editar cliente'}</div>
      <button class="icon-btn" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>Nombre del cliente</label>
        <input class="input" id="cName" value="${esc(c.name)}" placeholder="Ej: Estudio Belgrano">
      </div>
      <div class="field">
        <label>Color identificador</label>
        <div class="color-swatches" id="cSwatches">
          ${PALETTE.map(col => `<div class="color-swatch ${col===c.color?'selected':''}" style="background:${col}" data-color="${col}" onclick="pickColor(this)"></div>`).join('')}
        </div>
        <input type="hidden" id="cColor" value="${c.color}">
      </div>
    </div>
    <div class="modal-footer">
      <div>${!isNew ? `<button class="btn danger" onclick="confirmDeleteClient('${c.id}',true)">Eliminar cliente</button>` : ''}</div>
      <div style="display:flex;gap:8px;">
        <button class="btn ghost" onclick="closeModal()">Cancelar</button>
        <button class="btn primary" onclick="saveClient('${c.id}',${isNew})">Guardar</button>
      </div>
    </div>
  `);
  setTimeout(() => document.getElementById('cName').focus(), 50);
}

function pickColor(el) {
  el.parentElement.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('cColor').value = el.dataset.color;
}

async function saveClient(id, isNew) {
  const name = document.getElementById('cName').value.trim();
  if (!name) { toast('Falta el nombre'); return; }
  const color = document.getElementById('cColor').value;
  let c;
  if (isNew) {
    c = { id, name, color, createdAt: Date.now() };
    state.clients.push(c);
  } else {
    c = state.clients.find(x => x.id === id);
    c.name = name; c.color = color;
  }
  await Store.saveClient(c);
  closeModal();
  render();
  toast(isNew ? 'Cliente creado' : 'Cliente actualizado');
}

async function confirmDeleteClient(id, fromModal=false) {
  const c = state.clients.find(x => x.id === id);
  const plans = state.plans.filter(p => p.clientId === id);
  const posts = plans.flatMap(p => state.posts.filter(po => po.planId === p.id));
  if (!confirm(`¿Eliminar "${c.name}"?\nSe borrarán ${plans.length} planificación(es) y ${posts.length} post(s). Esta acción no se puede deshacer.`)) return;
  // Clean up video blobs
  for (const po of posts) {
    ensureMediaField(po);
    for (const item of (po.media || [])) {
      if (item.type === 'video') await VideoDB.delete(item.videoId);
    }
  }
  state.clients = state.clients.filter(x => x.id !== id);
  state.plans = state.plans.filter(p => p.clientId !== id);
  state.posts = state.posts.filter(po => !plans.some(p => p.id === po.planId));
  await Store.deleteClient(id);
  for (const p of plans) await Store.deletePlan(p.id);
  for (const po of posts) await Store.deletePost(po.id);
  if (fromModal) closeModal();
  if (state.currentClient && state.currentClient.id === id) goHome();
  else render();
  toast('Cliente eliminado');
}

          <input class="input" type="number" id="pYear" value="${p.year}" min="2020" max="2100">
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <div></div>
      <div style="display:flex;gap:8px;">
        <button class="btn ghost" onclick="closeModal()">Cancelar</button>
        <button class="btn primary" onclick="savePlan('${p.id}',${isNew})">Guardar</button>
      </div>
    </div>
  `);
  setTimeout(() => document.getElementById('pName').focus(), 50);
}

async function savePlan(id, isNew) {
  const name = document.getElementById('pName').value.trim();
  if (!name) { toast('Falta el nombre'); return; }
  const month = parseInt(document.getElementById('pMonth').value);
  const year = parseInt(document.getElementById('pYear').value);
  let p;
  if (isNew) {
    p = { id, clientId: state.currentClient.id, name, month, year, createdAt: Date.now() };
    state.plans.push(p);
  } else {
    p = state.plans.find(x => x.id === id);
    p.name = name; p.month = month; p.year = year;
  }
  await Store.savePlan(p);
  closeModal();
  render();
  toast(isNew ? 'Planificación creada' : 'Actualizada');
}

async function confirmDeletePlan(id) {
  const p = state.plans.find(x => x.id === id);
  const posts = state.posts.filter(po => po.planId === id);
  if (!confirm(`¿Eliminar "${p.name}"?\nSe borrarán ${posts.length} post(s).`)) return;
  // Clean up video blobs
  for (const po of posts) {
    ensureMediaField(po);
    for (const item of (po.media || [])) {
      if (item.type === 'video') await VideoDB.delete(item.videoId);
    }
  }
  state.plans = state.plans.filter(x => x.id !== id);
  state.posts = state.posts.filter(po => po.planId !== id);
  await Store.deletePlan(id);
  for (const po of posts) await Store.deletePost(po.id);
  if (state.currentPlan && state.currentPlan.id === id) goClient();
  else render();
  toast('Planificación eliminada');
}

/* ---- POST EDITOR ---- */
let editingPost = null;
let activeCarouselIndex = 0;

function openPostEditor(id = null, prefillDate = null) {
  editingPost = id
    ? ensureMediaField(JSON.parse(JSON.stringify(state.posts.find(p => p.id === id))))
    : { id: uid(), planId: state.currentPlan.id, type: 'post', date: prefillDate || '', time: '', media: [], copy: '', hashtags: [], cta: '', notes: '' };
  activeCarouselIndex = 0;
  renderPostEditor();
}

function renderPostEditor() {
  const p = editingPost;
  const t = POST_TYPES[p.type];
  const isNew = !state.posts.some(x => x.id === p.id);
  openModal(`
    <div class="modal-header">
      <div class="modal-title">${isNew?'Nuevo':'Editar'} contenido</div>
      <button class="icon-btn" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="type-picker">
        ${Object.entries(POST_TYPES).map(([k,v]) => `
          <div class="type-option ${k===p.type?'selected':''}" onclick="changePostType('${k}')">
            <div class="type-option-icon">${v.icon}</div>
            <div class="type-option-name">${v.label}</div>
          </div>
        `).join('')}
      </div>

      <div class="editor-split">
        <div class="editor-media">
          ${renderMediaEditor(p, t)}
        </div>

        <div>
          <div class="field-row">
            <div class="field">
              <label>Fecha de publicación</label>
              <input class="input" type="date" id="pDate" value="${p.date||''}">
            </div>
            <div class="field">
              <label>Hora</label>
              <input class="input" type="time" id="pTime" value="${p.time||''}">
            </div>
          </div>

          <div class="field">
            <label>Copy / Texto del post</label>
            <textarea class="textarea" id="pCopy" placeholder="Escribí acá el texto que acompaña al post…">${esc(p.copy)}</textarea>
          </div>

          <div class="field">
            <label>Hashtags</label>
            <div class="hashtag-input-wrap" id="hashtagWrap" onclick="document.getElementById('hashtagInput').focus()">
              ${p.hashtags.map((h,i) => `<span class="hashtag-chip">#${esc(h)}<button onclick="removeHashtag(${i})">×</button></span>`).join('')}
              <input class="hashtag-input" id="hashtagInput" placeholder="Escribí y Enter…" onkeydown="handleHashtagKey(event)">
            </div>
          </div>

          <div class="field-row">
            <div class="field">
              <label>CTA (opcional)</label>
              <input class="input" id="pCta" value="${esc(p.cta)}" placeholder="Ej: Link en bio">
            </div>
            <div class="field">
              <label>Notas internas</label>
              <input class="input" id="pNotes" value="${esc(p.notes)}" placeholder="Solo para vos">
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <div>${!isNew ? `<button class="btn danger" onclick="confirmDeletePost('${p.id}',true)">Eliminar</button>` : ''}</div>
      <div style="display:flex;gap:8px;">
        <button class="btn ghost" onclick="closeModal()">Cancelar</button>
        <button class="btn primary" onclick="savePost()">Guardar</button>
      </div>
    </div>
  `);
  attachVideoSources();
}

function renderMediaEditor(p, t) {
  const acceptTypes = t.vertical ? 'image/*,video/*' : (t.multi ? 'image/*,video/*' : 'image/*,video/*');
  const dropHint = t.vertical
    ? 'Tocá para <strong>subir imagen o video</strong><br>formato 9:16 recomendado'
    : t.multi
      ? 'Tocá para <strong>agregar imágenes o videos</strong><br>al carrusel'
      : 'Tocá para <strong>subir imagen o video</strong><br>formato 1:1 recomendado';

  const renderMain = (item) => {
    if (!item) {
      return `
        <div style="font-family:var(--font-display);font-size:32px;margin-bottom:8px;">${t.icon}</div>
        <div class="media-drop-hint">${dropHint}</div>
      `;
    }
    if (item.type === 'image') return `<img src="${item.src}">`;
    // video → render <video> with poster + controls; attach source async
    return `
      <video controls playsinline preload="metadata" poster="${item.thumb || ''}" style="width:100%;height:100%;object-fit:cover;background:#000;" data-video-id="${item.videoId}"></video>
      <div class="video-badge">▶ VIDEO${item.duration ? ' · ' + formatDuration(item.duration) : ''}</div>
    `;
  };

  if (t.multi) {
    const active = p.media[activeCarouselIndex];
    return `
      <div class="media-drop" onclick="triggerMediaUpload()">
        ${renderMain(active)}
      </div>
      <div class="carousel-slides">
        ${p.media.map((it,i) => `
          <div class="carousel-slide ${i===activeCarouselIndex?'active':''}" onclick="event.stopPropagation();setCarouselActive(${i})">
            ${it.type === 'image'
              ? `<img src="${it.src}">`
              : `<img src="${it.thumb || ''}"><span class="slide-play">▶</span>`}
            <button class="del" onclick="event.stopPropagation();removeMediaItem(${i})">×</button>
          </div>
        `).join('')}
        <div class="carousel-add" onclick="event.stopPropagation();triggerMediaUpload()">+</div>
      </div>
      <input type="file" id="mediaInput" accept="${acceptTypes}" multiple style="display:none" onchange="handleMediaUpload(event)">
    `;
  } else {
    const has = p.media[0];
    return `
      <div class="media-drop ${t.vertical?'vertical':''}" onclick="${has && has.type==='video' ? '' : 'triggerMediaUpload()'}">
        ${renderMain(has)}
      </div>
      ${has ? `
        <div class="media-actions">
          <button onclick="triggerMediaUpload()">Reemplazar</button>
          <button onclick="removeMediaItem(0)">Quitar</button>
        </div>
      ` : ''}
      <input type="file" id="mediaInput" accept="${acceptTypes}" style="display:none" onchange="handleMediaUpload(event)">
    `;
  }
}

function formatDuration(s) {
  s = Math.round(s);
  const m = Math.floor(s / 60);
  const ss = String(s % 60).padStart(2,'0');
  return `${m}:${ss}`;
}

/* After render, attach blob URLs to <video> elements */
async function attachVideoSources() {
  const videos = document.querySelectorAll('video[data-video-id]');
  for (const v of videos) {
    if (v.src) continue;
    const url = await videoUrl(v.dataset.videoId);
    if (url) v.src = url;
  }
}

function changePostType(type) {
  captureFormInputs();
  editingPost.type = type;
  const t = POST_TYPES[type];
  if (!t.multi && editingPost.media.length > 1) {
    // If shrinking from carousel to single, clean up video blobs being discarded
    const dropped = editingPost.media.slice(1);
    for (const it of dropped) {
      if (it.type === 'video') VideoDB.delete(it.videoId);
    }
    editingPost.media = editingPost.media.slice(0,1);
  }
  activeCarouselIndex = 0;
  renderPostEditor();
}

function triggerMediaUpload() { document.getElementById('mediaInput').click(); }

async function handleMediaUpload(e) {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  const t = POST_TYPES[editingPost.type];
  captureFormInputs();
  const hasVideo = files.some(f => f.type.startsWith('video/'));
  toast(hasVideo ? 'Procesando video (esto puede tardar unos segundos)…' : 'Procesando imagen(es)…');
  try {
    const items = [];
    for (const f of files) {
      items.push(await processMediaFile(f));
    }
    if (t.multi) editingPost.media.push(...items);
    else {
      // single-media type: replace, and if replacing a video, clean up old blob
      if (editingPost.media[0] && editingPost.media[0].type === 'video') {
        await VideoDB.delete(editingPost.media[0].videoId);
      }
      editingPost.media = [items[0]];
    }
    activeCarouselIndex = editingPost.media.length - 1;
    renderPostEditor();
    toast(hasVideo ? 'Video listo ✓' : 'Imagen lista ✓');
  } catch(err) {
    toast('Error: ' + err.message);
    console.error(err);
  }
}

function setCarouselActive(i) {
  captureFormInputs();
  activeCarouselIndex = i;
  renderPostEditor();
}

async function removeMediaItem(i) {
  captureFormInputs();
  const item = editingPost.media[i];
  if (item && item.type === 'video') {
    await VideoDB.delete(item.videoId);
  }
  editingPost.media.splice(i,1);
  if (activeCarouselIndex >= editingPost.media.length) activeCarouselIndex = Math.max(0, editingPost.media.length-1);
  renderPostEditor();
}

function handleHashtagKey(e) {
  if (e.key === 'Enter' || e.key === ',') {
    e.preventDefault();
    const val = e.target.value.trim().replace(/^#/,'').replace(/\s+/g,'');
    if (val) {
      editingPost.hashtags.push(val);
      e.target.value = '';
      // capture current inputs before re-render
      captureFormInputs();
      renderPostEditor();
    }
  } else if (e.key === 'Backspace' && !e.target.value && editingPost.hashtags.length) {
    editingPost.hashtags.pop();
    captureFormInputs();
    renderPostEditor();
  }
}

function removeHashtag(i) {
  editingPost.hashtags.splice(i,1);
  captureFormInputs();
  renderPostEditor();
}

function captureFormInputs() {
  const g = (id) => document.getElementById(id);
  if (g('pDate')) editingPost.date = g('pDate').value;
  if (g('pTime')) editingPost.time = g('pTime').value;
  if (g('pCopy')) editingPost.copy = g('pCopy').value;
  if (g('pCta'))  editingPost.cta  = g('pCta').value;
  if (g('pNotes')) editingPost.notes = g('pNotes').value;
}

async function savePost() {
  captureFormInputs();
  // Drop legacy field so storage stays clean
  delete editingPost.images;
  const existing = state.posts.find(x => x.id === editingPost.id);
  if (existing) {
    Object.assign(existing, editingPost);
    await Store.savePost(existing);
  } else {
    state.posts.push(editingPost);
    await Store.savePost(editingPost);
  }
  closeModal();
  render();
  toast('Post guardado');
}

async function duplicatePost(id) {
  const p = ensureMediaField(state.posts.find(x => x.id === id));
  const copy = JSON.parse(JSON.stringify(p));
  copy.id = uid();
  copy.date = '';
  // Duplicate any videos in IDB so deleting the original doesn't break the copy
  for (const item of copy.media) {
    if (item.type === 'video') {
      const blob = await VideoDB.get(item.videoId);
      if (blob) {
        const newId = 'v_' + uid();
        await VideoDB.put(newId, blob);
        item.videoId = newId;
      }
    }
  }
  state.posts.push(copy);
  await Store.savePost(copy);
  render();
  toast('Post duplicado');
}

async function confirmDeletePost(id, fromModal=false) {
  if (!confirm('¿Eliminar este post?')) return;
  const p = ensureMediaField(state.posts.find(x => x.id === id));
  // Clean up any video blobs
  for (const item of (p.media || [])) {
    if (item.type === 'video') await VideoDB.delete(item.videoId);
  }
  state.posts = state.posts.filter(x => x.id !== id);
  await Store.deletePost(id);
  if (fromModal) closeModal();
  render();
  toast('Post eliminado');
}

/* ---- IMPORT/EXPORT ---- */
async function handleImport(e) {
  const f = e.target.files[0];
  if (!f) return;
  if (!confirm('Esto reemplazará todos los datos actuales. ¿Continuar?')) return;
  try {
    await Store.importBackup(f);
    state.posts.forEach(ensureMediaField);
    render();
    toast('Backup importado');
  } catch(err) {
    alert('Error al importar: ' + err.message);
  }
}

/* ---- EXPORT CLIENT HTML (read-only) ---- */
async function exportPlanHTML() {
  const client = state.currentClient;
  const plan = state.currentPlan;
  const posts = state.posts.filter(p => p.planId === plan.id)
    .map(ensureMediaField)
    .sort((a,b) => (a.date||'z').localeCompare(b.date||'z'));

  // Resolve any video blobs → base64 data URLs (embebed in the HTML)
  let videoBytes = 0;
  const videoCount = posts.reduce((n, p) => n + p.media.filter(m => m.type==='video').length, 0);
  if (videoCount) toast(`Embebiendo ${videoCount} video(s), aguantá un momento…`);

  const postsResolved = [];
  for (const p of posts) {
    const media = [];
    for (const m of p.media) {
      if (m.type === 'video') {
        const blob = await VideoDB.get(m.videoId);
        if (blob) {
          videoBytes += blob.size;
          const dataUrl = await blobToDataURL(blob);
          media.push({ ...m, dataUrl });
        } else {
          media.push({ ...m, dataUrl: null });
        }
      } else {
        media.push(m);
      }
    }
    postsResolved.push({ ...p, media });
  }

  if (videoBytes > 100 * 1024 * 1024) {
    if (!confirm(`El archivo va a pesar ~${(videoBytes/1024/1024).toFixed(0)} MB por los videos embebidos. ¿Continuar?\n\nTip: para archivos así de pesados quizás convenga usar WeTransfer o Drive.`)) return;
  }

  const html = buildClientHTML(client, plan, postsResolved);
  const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const safe = (s) => s.replace(/[^a-z0-9]+/gi,'-').toLowerCase();
  a.download = `${safe(client.name)}-${safe(plan.name)}.html`;
  a.click();
  URL.revokeObjectURL(url);
  toast('Archivo descargado ✓');
}

function blobToDataURL(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}

function buildClientHTML(client, plan, posts) {
  const feedPosts = posts.filter(p => !POST_TYPES[p.type].vertical);
  const verticalPosts = posts.filter(p => POST_TYPES[p.type].vertical);

  const mediaTag = (m) => {
    if (m.type === 'image') return `<img src="${m.src}">`;
    if (m.type === 'video' && m.dataUrl) {
      return `<video controls playsinline preload="metadata" poster="${m.thumb||''}" src="${m.dataUrl}"></video>`;
    }
    return `<div class="no-img">Video no disponible</div>`;

  const postCard = (p) => {
    const t = POST_TYPES[p.type];
    const media = p.media || [];
    return `

              ? `<div class="carousel" data-count="${media.length}">
                  ${media.map((m,i) => `<div class="slide ${i===0?'active':''}">${mediaTag(m)}</div>`).join('')}

                  <button class="cnav next" onclick="carouselNav(this,1)">›</button>
                  <div class="cdots">${media.map((_,i) => `<span class="${i===0?'on':''}"></span>`).join('')}</div>
                </div>`

        </div>
        <div class="post-body">
          <div class="post-header">
            <div class="post-date">${p.date ? new Date(p.date+'T00:00:00').toLocaleDateString('es-AR',{weekday:'long',day:'2-digit',month:'long'}) : 'Sin fecha'}${p.time?' · '+p.time+' hs':''}</div>
            ${p.cta ? `<div class="post-cta">${esc(p.cta)}</div>`:''}
          </div>
          <div class="post-copy">${esc(p.copy).replace(/\n/g,'<br>') || '<em class="dim">Sin copy</em>'}</div>
          ${p.hashtags && p.hashtags.length ? `<div class="post-tags">${p.hashtags.map(h => `<span>#${esc(h)}</span>`).join('')}</div>` : ''}
        </div>
      </article>
    `;
  };

  return `<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>${esc(client.name)} — ${esc(plan.name)}</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  .post-header { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }

  .post-cta { font-family: var(--font-mono); font-size: 10px; font-weight: 500; color: var(--ink); background: color-mix(in srgb, var(--accent) 22%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent); padding: 2px 7px; border-radius: 999px; }
  .post-copy { font-size: 12.5px; line-height: 1.5; color: var(--ink); white-space: pre-wrap; word-break: break-word; }
  .dim { color: var(--ink-dim); opacity: 0.6; }
  .post-tags { display:flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
  .post-tags span { font-family: var(--font-mono); font-size: 10px; color: color-mix(in srgb, var(--accent) 80%, var(--ink) 20%); background: color-mix(in srgb, var(--accent) 8%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 20%, transparent); padding: 2px 7px; border-radius: 999px; }
  footer { margin-top: 60px; padding-top: 24px; border-top: 1px solid var(--border); font-family: var(--font-mono); font-size: 11px; color: var(--ink-dim); text-align: center; letter-spacing: 0.05em; }
  /* Read-only: bloqueamos edición de contenteditable si algún navegador lo interpretara */
  [contenteditable] { pointer-events: none; }
  @media print {
    body { background: white; color: black; }
    .post-card { break-inside: avoid; border-color: #ddd; background: white; color: black; }
    .post-copy, .post-date, .post-cta, .post-tags span { color: black !important; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="brand-tag">Planificación de contenidos</div>
    <h1>${esc(client.name)}</h1>
    <div class="meta">${esc(plan.name)} · ${MONTHS[plan.month]} ${plan.year} · ${posts.length} pieza${posts.length!==1?'s':''}</div>
  </header>

  ${feedPosts.length ? `
    <div class="section-label">Feed — Posts &amp; Carruseles</div>
    <div class="grid">${feedPosts.map(postCard).join('')}</div>
  `:''}

  ${verticalPosts.length ? `
    <div class="section-label">Stories · Reels · TikTok</div>
    <div class="grid">${verticalPosts.map(postCard).join('')}</div>
  `:''}

  ${!posts.length ? `<div style="text-align:center;padding:80px;color:var(--ink-dim);">Aún no hay contenido cargado.</div>` : ''}

  <footer>Documento generado el ${new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'long',year:'numeric'})} · Solo lectura</footer>
</div>
<script>
function carouselNav(btn, dir) {
  const car = btn.closest('.carousel');
  const slides = car.querySelectorAll('.slide');
  const dots = car.querySelectorAll('.cdots span');
  let i = 0; slides.forEach((s,idx) => { if (s.classList.contains('active')) i = idx; });
  slides[i].classList.remove('active'); dots[i]?.classList.remove('on');
  i = (i + dir + slides.length) % slides.length;
  slides[i].classList.add('active'); dots[i]?.classList.add('on');
}
<\/script>
</body>
</html>`;
}

/* ---- SETTINGS ---- */
function openSettings() {
  const totalClients = state.clients.length;
  const totalPlans = state.plans.length;
  const totalPosts = state.posts.length;
  openModal(`
    <div class="modal-header">
      <div class="modal-title">Ajustes</div>
      <button class="icon-btn" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>Almacenamiento actual</label>
        <div style="background:var(--bg);padding:14px;border-radius:8px;font-family:var(--font-mono);font-size:12.5px;line-height:1.6;">
          ${Store.useCloud
            ? `🟢 Firebase (nube) — sincronizado como <span style="color:var(--lime);">${esc(Store.user?.email || '')}</span>`
            : '🟡 LocalStorage (este navegador) — los datos viven acá'}
        </div>
        ${Store.useCloud ? `
          <div style="margin-top:10px;">
            <button class="btn" onclick="Store.signOutUser();closeModal()">Cerrar sesión</button>
          </div>
        ` : ''}
      </div>

      <div class="field">
        <label>Datos guardados</label>
        <div style="background:var(--bg);padding:14px;border-radius:8px;font-family:var(--font-mono);font-size:12.5px;line-height:1.8;">
          ${totalClients} cliente${totalClients!==1?'s':''}<br>
          ${totalPlans} planificación${totalPlans!==1?'es':''}<br>
          ${totalPosts} post${totalPosts!==1?'s':''}
        </div>
      </div>

      <div class="field">
        <label>Backup y restauración</label>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn" onclick="Store.exportBackup()">Descargar backup .json</button>
          <label class="btn" style="cursor:pointer;">
            Importar backup
            <input type="file" accept="application/json" style="display:none" onchange="handleImport(event);closeModal()">
          </label>
        </div>
        <div style="font-size:11.5px;color:var(--ink-dim);margin-top:8px;line-height:1.5;">
          Descargá un archivo con todos tus clientes, planificaciones y posts (incluyendo imágenes). Guardalo en Drive o donde prefieras — sirve como respaldo.
        </div>
      </div>

      ${!Store.useCloud ? `
        <div class="field">
          <label>Sincronización en la nube</label>
          <div style="background:var(--bg);padding:14px;border-radius:8px;font-size:12.5px;line-height:1.6;color:var(--ink-dim);">
            Para activar Firebase y sincronizar entre dispositivos:
            <ol style="margin:10px 0 0 20px;">
              <li>Creá un proyecto en <span style="color:var(--accent-soft);">console.firebase.google.com</span></li>
              <li>Activá Firestore y Authentication (Anónimo)</li>
              <li>Copiá tu config en la variable <code style="background:var(--card);padding:2px 6px;border-radius:4px;">FB_CONFIG</code> del archivo HTML</li>
              <li>Recargá la página</li>
            </ol>
          </div>
        </div>
      ` : ''}
    </div>
    <div class="modal-footer">
      <div></div>
      <button class="btn primary" onclick="closeModal()">Cerrar</button>
    </div>
  `);
}

(async () => {
  await VideoDB.init();
  await Store.init();
  state.posts.forEach(ensureMediaField);
  render();
})();
